[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hsk-api"
version = "0.1.0"
description = "FastAPI backend for the Chinese HSK Trainer app (FSRS scheduling + Claude-powered expression écrite correction)."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Ivann Vasic" }]
license = "MIT"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.0",
    "python-jose[cryptography]>=3.3",
    "email-validator>=2.0",
    "fsrs>=6.0,<7.0",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
]

[tool.setuptools]
# Tell setuptools exactly which top-level packages to ship. The repo also has
# `alembic/`, `data/`, `tests/` at the root of `backend/` which are NOT Python
# packages we want bundled into the installed distribution.
packages = ["app"]
include-package-data = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["E501"]
