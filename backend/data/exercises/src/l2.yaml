# HSK 2 — questions written for this app, in the format of the official papers.
# pic_match and short_mcq are used by both versions (words of both lists);
# pic_judge and long_mcq only by HSK 2.0; pic_choice and char_pinyin only by HSK 3.0.
# Append new items at the end (ids are numbered by position).

pic_choice:
  - audio: 我每天坐地铁去上班。
    fr: Je vais au travail en métro tous les jours.
    options: ["Des gens debout dans une rame de métro", "Un homme qui va au travail à vélo", "Une femme qui conduit sa voiture"]
    answer: A
  - audio: 她穿着一件红色的衣服。
    fr: Elle porte un vêtement rouge.
    options: ["Une femme en manteau bleu", "Une femme en manteau rouge", "Un homme en chemise rouge"]
    answer: B
  - audio: 我的书包在床上。
    fr: Mon cartable est sur le lit.
    options: ["Un cartable sous une table", "Un sac de sport sur une chaise", "Un cartable posé sur un lit"]
    answer: C
  - audio: 爷爷每天早上都去跑步。
    fr: Grand-père va courir tous les matins.
    options: ["Un grand-père qui court le matin", "Un grand-père qui lit dans son lit", "Une jeune femme qui court"]
    answer: A
  - audio: 弟弟在洗手间洗手。
    fr: Mon petit frère se lave les mains aux toilettes.
    options: ["Un garçon qui prend une douche", "Un petit garçon qui se lave les mains au lavabo", "Un garçon qui boit un verre d'eau"]
    answer: B
  - audio: 下午我们一起去踢足球吧。
    fr: Allons jouer au foot ensemble cet après-midi.
    options: ["Des filles qui jouent au basket", "Des enfants qui nagent", "Des garçons qui jouent au football"]
    answer: C
  - audio: 外面下雪了。
    fr: Il neige dehors.
    options: ["Une rue couverte de neige", "Une rue sous la pluie", "Un jardin ensoleillé"]
    answer: A
  - audio: 妈妈正在给孩子们做饭。
    fr: Maman est en train de préparer à manger pour les enfants.
    options: ["Une mère qui lit une histoire à ses enfants", "Une mère qui prépare le repas pour ses enfants", "Une mère qui fait les courses"]
    answer: B
  - audio: 桌子上有一杯奶茶。
    fr: Il y a un thé au lait sur la table.
    options: ["Une tasse de café sur un bureau", "Un verre de jus d'orange", "Un verre de thé au lait sur une table"]
    answer: C
  - audio: 他头疼，要去医院。
    fr: Il a mal à la tête, il doit aller à l'hôpital.
    options: ["Un homme qui se tient la tête, l'air malade", "Un homme qui rit avec des amis", "Un homme qui court dans un parc"]
    answer: A
  - audio: 我们坐飞机去旅游。
    fr: Nous partons en voyage en avion.
    options: ["Une famille qui part en voiture", "Une famille avec des valises dans un aéroport", "Une famille qui monte dans un train"]
    answer: B
  - audio: 小狗在门口睡觉。
    fr: Le petit chien dort devant la porte.
    options: ["Un chat qui dort sur le lit", "Un petit chien qui court dans un parc", "Un petit chien qui dort devant la porte"]
    answer: C
  - audio: 我妹妹很喜欢画画。
    fr: Ma petite sœur adore dessiner.
    options: ["Une fillette qui dessine", "Une fillette qui chante", "Une fillette qui danse"]
    answer: A
  - audio: 他在网上买东西。
    fr: Il fait des achats en ligne.
    options: ["Un homme qui pousse un chariot au supermarché", "Un homme qui fait des achats sur son ordinateur", "Un homme qui vend des fruits"]
    answer: B
  - audio: 你看，天上有一只鸟。
    fr: Regarde, il y a un oiseau dans le ciel.
    options: ["Un avion dans le ciel", "Un chat sur un toit", "Un oiseau qui vole dans le ciel"]
    answer: C

