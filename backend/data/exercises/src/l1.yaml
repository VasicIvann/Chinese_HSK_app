pic_match:
  - options:
      - Un homme et une femme qui se serrent la main
      - Un chat qui dort sur une chaise
      - Une femme qui achète des fruits au marché
      - Une fille qui regarde la télévision
      - Une femme qui monte dans un taxi
      - Un homme qui boit du thé
    items:
      - audio: |-
          男：你好！我叫王明。
          女：认识你，我很高兴。
        fr: "— Bonjour ! Je m'appelle Wang Ming. — Ravie de te connaître."
        answer: A
      - audio: |-
          女：这些苹果多少钱？
          男：十块钱。
        fr: "— Combien coûtent ces pommes ? — Dix yuans."
        answer: C
      - audio: |-
          男：你在做什么？
          女：我在看电视。
        fr: "— Qu'est-ce que tu fais ? — Je regarde la télé."
        answer: D
      - audio: |-
          女：先生，去医院。
          男：好的，请坐。
        fr: "— Monsieur, à l'hôpital s'il vous plaît. — Bien, asseyez-vous."
        answer: E
      - audio: |-
          男：猫在哪儿？
          女：在那个椅子上睡觉。
        fr: "— Où est le chat ? — Il dort sur cette chaise-là."
        answer: B
  - options:
      - Un médecin qui parle à une patiente à l'hôpital
      - Des élèves dans une salle de classe
      - Un homme qui lit dans un fauteuil
      - Un avion qui décolle
      - Une femme qui fait cuire du riz
      - Un homme qui offre un vêtement à une femme
    items:
      - audio: |-
          女：医生，我明天能回家吗？
          男：能，明天下午回家。
        fr: "— Docteur, est-ce que je pourrai rentrer chez moi demain ? — Oui, demain après-midi."
        answer: A
      - audio: |-
          女：现在我们读书。
          男：好的，老师。
        fr: "— Maintenant, nous lisons. — D'accord, professeur."
        answer: B
      - audio: |-
          男：你几点的飞机？
          女：下午三点的。
        fr: "— Ton avion est à quelle heure ? — À trois heures de l'après-midi."
        answer: D
      - audio: |-
          男：你看，这是什么？
          女：衣服！谢谢你，我很喜欢。
        fr: "— Regarde, qu'est-ce que c'est ? — Un vêtement ! Merci, il me plaît beaucoup."
        answer: F
      - audio: |-
          女：我在做米饭。
          男：太好了！
        fr: "— Je fais cuire du riz. — Super !"
        answer: E
  - options:
      - Une femme qui achète une chaise dans un magasin
      - Un homme qui écrit son nom sur une feuille
      - Un homme et une femme qui regardent un petit chien
      - Deux amies qui boivent du thé
      - Une petite fille qui dit au revoir à son père devant l'école
      - Un homme qui a très chaud et boit de l'eau
    items:
      - audio: |-
          女：请写你的名字。
          男：好。
        fr: "— Écrivez votre nom, s'il vous plaît. — D'accord."
        answer: B
      - audio: |-
          女：你喝水吗？
          男：喝，今天太热了。
        fr: "— Tu bois de l'eau ? — Oui, il fait trop chaud aujourd'hui."
        answer: F
      - audio: |-
          男：女儿，再见！
          女：爸爸再见！
        fr: "— Au revoir, ma fille ! — Au revoir, papa !"
        answer: E
      - audio: |-
          女：这个椅子多少钱？
          男：八十块。
        fr: "— Combien coûte cette chaise ? — Quatre-vingts yuans."
        answer: A
      - audio: |-
          男：那是你的狗吗？
          女：是，是我的狗。
        fr: "— C'est ton chien ? — Oui, c'est mon chien."
        answer: C

