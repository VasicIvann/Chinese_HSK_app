short_mcq:
  - audio: 女：下午我去商店，我想买一些水果。
    q: 她下午去哪儿？
    fr: Cet après-midi, je vais au magasin, je voudrais acheter des fruits.
    qfr: Où va-t-elle cet après-midi ?
    options: [商店, 医院, 学校]
    ofr: [au magasin, à l'hôpital, à l'école]
    answer: A
  - audio: 男：我是学生，我在中国学习汉语。
    q: 他在中国做什么？
    fr: Je suis étudiant, j'étudie le chinois en Chine.
    qfr: Que fait-il en Chine ?
    options: [工作, 学习汉语, 看朋友]
    ofr: [il travaille, il étudie le chinois, il rend visite à des amis]
    answer: B
  - audio: 女：我儿子八岁了。
    q: 她儿子多大？
    fr: Mon fils a huit ans.
    qfr: Quel âge a son fils ?
    options: [六岁, 七岁, 八岁]
    ofr: [six ans, sept ans, huit ans]
    answer: C
  - audio: 男：明天星期六，我想去看电影。
    q: 他明天想做什么？
    fr: Demain c'est samedi, je voudrais aller voir un film.
    qfr: Que veut-il faire demain ?
    options: [看电影, 买衣服, 去医院]
    ofr: [voir un film, acheter des vêtements, aller à l'hôpital]
    answer: A
  - audio: 女：今天天气不好，很冷。
    q: 今天天气怎么样？
    fr: Il ne fait pas beau aujourd'hui, il fait très froid.
    qfr: Quel temps fait-il aujourd'hui ?
    options: [很热, 很冷, 下雨了]
    ofr: [très chaud, très froid, il pleut]
    answer: B
  - audio: 男：现在是上午十点。
    q: 现在几点？
    fr: Il est maintenant dix heures du matin.
    qfr: Quelle heure est-il ?
    options: [九点, 十点, 十一点]
    ofr: [neuf heures, dix heures, onze heures]
    answer: B
  - audio: 女：我坐出租车去医院。
    q: 她去哪儿？
    fr: Je vais à l'hôpital en taxi.
    qfr: Où va-t-elle ?
    options: [医院, 学校, 饭店]
    ofr: [à l'hôpital, à l'école, au restaurant]
    answer: A
  - audio: 男：这个杯子是我女儿的。
    q: 杯子是谁的？
    fr: Cette tasse est à ma fille.
    qfr: À qui est la tasse ?
    options: [他儿子的, 他女儿的, 他朋友的]
    ofr: [à son fils, à sa fille, à son ami]
    answer: B
  - audio: 女：我昨天买了三本书。
    q: 她买了什么？
    fr: Hier, j'ai acheté trois livres.
    qfr: Qu'a-t-elle acheté ?
    options: [书, 衣服, 杯子]
    ofr: [des livres, des vêtements, des tasses]
    answer: A
  - audio: 男：我很喜欢喝茶，不喜欢喝水。
    q: 他喜欢喝什么？
    fr: J'aime beaucoup boire du thé, je n'aime pas boire de l'eau.
    qfr: Qu'aime-t-il boire ?
    options: [水, 茶, 都不喜欢]
    ofr: [de l'eau, du thé, il n'aime rien]
    answer: B
  - audio: 女：王先生是我们的汉语老师。
    q: 王先生是做什么的？
    fr: M. Wang est notre professeur de chinois.
    qfr: Que fait M. Wang ?
    options: [医生, 学生, 老师]
    ofr: [médecin, étudiant, professeur]
    answer: C
  - audio: 男：我住在学校里。
    q: 他住在哪儿？
    fr: J'habite dans l'école.
    qfr: Où habite-t-il ?
    options: [学校里, 饭店, 朋友家]
    ofr: [dans l'école, à l'hôtel, chez un ami]
    answer: A
  - audio: 女：那个桌子太大了，我不想买。
    q: 那个桌子怎么样？
    fr: Cette table est trop grande, je ne veux pas l'acheter.
    qfr: Comment est cette table ?
    options: [太小了, 太大了, 很漂亮]
    ofr: [trop petite, trop grande, très jolie]
    answer: B
  - audio: 男：明天我和同学去看电影。
    q: 他和谁去看电影？
    fr: Demain, je vais voir un film avec un camarade de classe.
    qfr: Avec qui va-t-il voir un film ?
    options: [爸爸, 老师, 同学]
    ofr: [son père, son professeur, un camarade]
    answer: C
  - audio: 女：今天下雨，我不去商店了。
    q: 她今天去商店吗？
    fr: Il pleut aujourd'hui, je ne vais plus au magasin.
    qfr: Va-t-elle au magasin aujourd'hui ?
    options: [去, 不去, 下午去]
    ofr: [oui, non, l'après-midi]
    answer: B
