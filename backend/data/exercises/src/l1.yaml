# HSK 1 — questions written for this app, in the format of the official papers.
# Pictures of the real papers are French descriptions of the scene.
# Keep the order: ids are numbered by position (append new items at the end).
# Vocabulary: items used by both versions stay inside the HSK 2.0 level-1 list
# (150 words), which the 3.0 list covers; the build script checks it.

pic_choice:
  - audio: 三个苹果。
    fr: Trois pommes.
    options: ["Deux pommes sur une assiette", "Trois oranges dans un panier", "Trois pommes sur une table"]
    answer: C
  - audio: 我在看书。
    fr: Je lis (un livre).
    options: ["Une fille qui lit un livre", "Une fille qui regarde la télévision", "Une fille qui dort"]
    answer: A
  - audio: 她在打电话。
    fr: Elle est au téléphone.
    options: ["Une femme qui écrit une lettre", "Une femme qui parle au téléphone", "Une femme qui mange du riz"]
    answer: B
  - audio: 今天很热。
    fr: Il fait très chaud aujourd'hui.
    options: ["Une rue couverte de neige", "Des gens sous des parapluies", "Un homme en tee-shirt qui s'essuie le front sous un grand soleil"]
    answer: C
  - audio: 猫在桌子上。
    fr: Le chat est sur la table.
    options: ["Un chat assis sur une table", "Un chat qui dort sous une chaise", "Un chien couché sur une table"]
    answer: A
  - audio: 他是医生。
    fr: Il est médecin.
    options: ["Un professeur devant un tableau", "Un homme en blouse blanche avec un stéthoscope", "Un chauffeur dans son taxi"]
    answer: B
  - audio: 我们坐飞机去中国。
    fr: Nous allons en Chine en avion.
    options: ["Un train dans une gare", "Une famille dans un taxi", "Un avion dans le ciel"]
    answer: C
  - audio: 下雨了。
    fr: Il pleut.
    options: ["Une rue sous la pluie, des gens avec des parapluies", "Un ciel bleu et un grand soleil", "Des enfants qui jouent dans la neige"]
    answer: A
  - audio: 他在睡觉。
    fr: Il dort.
    options: ["Un homme qui lit dans un fauteuil", "Un homme qui dort dans son lit", "Un homme qui boit un café"]
    answer: B
  - audio: 我想喝茶。
    fr: Je voudrais boire du thé.
    options: ["Un bol de riz", "Une bouteille d'eau", "Une tasse de thé chaud"]
    answer: C
  - audio: 这是我的狗。
    fr: C'est mon chien.
    options: ["Un garçon qui tient un chien en laisse", "Une fille qui caresse un chat", "Un homme qui donne à manger à un oiseau"]
    answer: A
  - audio: 我女儿七岁了。
    fr: Ma fille a sept ans.
    options: ["Un bébé dans les bras de sa mère", "Une fillette devant un gâteau avec sept bougies", "Une grand-mère devant un gâteau d'anniversaire"]
    answer: B
  - audio: 我买了一些水果。
    fr: J'ai acheté des fruits.
    options: ["Une femme qui essaie un manteau", "Un homme qui achète des livres", "Un panier plein de fruits"]
    answer: C
  - audio: 现在三点。
    fr: Il est trois heures.
    options: ["Une horloge qui indique trois heures", "Une horloge qui indique huit heures", "Une horloge qui indique midi"]
    answer: A
  - audio: 我们在学校学习汉语。
    fr: Nous étudions le chinois à l'école.
    options: ["Une famille au restaurant", "Des élèves en classe devant des caractères chinois au tableau", "Un médecin et une patiente à l'hôpital"]
    answer: B

pic_answer:
  - audio: 今天天气怎么样？
    fr: Quel temps fait-il aujourd'hui ?
    options: ["Une horloge qui indique huit heures", "Une famille à table", "Un ciel bleu avec un grand soleil"]
    answer: C
  - audio: 你家有几口人？
    fr: Combien êtes-vous dans ta famille ?
    options: ["Une photo d'une famille de quatre personnes", "Un bol de nouilles", "Un taxi dans la rue"]
    answer: A
  - audio: 你想吃什么？
    fr: Qu'est-ce que tu veux manger ?
    options: ["Une voiture rouge", "Une assiette de raviolis chinois (jiaozi)", "Un calendrier"]
    answer: B
  - audio: 现在几点？
    fr: Quelle heure est-il ?
    options: ["Une tasse de thé", "Un chat qui dort", "Une horloge qui indique sept heures"]
    answer: C
  - audio: 你的手机在哪儿？
    fr: Où est ton téléphone ?
    options: ["Un téléphone posé sur le lit", "Un homme qui court", "Un gâteau d'anniversaire"]
    answer: A
  - audio: 你今年多大？
    fr: Quel âge as-tu cette année ?
    options: ["Une rue sous la pluie", "Un gâteau avec huit bougies", "Un magasin de vêtements"]
    answer: B
  - audio: 你在做什么？
    fr: Qu'est-ce que tu fais ?
    options: ["Un ciel nuageux", "Un billet de cent yuans", "Une femme qui fait la cuisine"]
    answer: C
  - audio: 这个多少钱？
    fr: Combien coûte celui-ci ?
    options: ["Une étiquette de prix « 20 元 »", "Un chien qui dort", "Un lit défait"]
    answer: A
  - audio: 明天星期几？
    fr: Quel jour de la semaine sommes-nous demain ?
    options: ["Un bol de riz", "Un calendrier avec le samedi entouré", "Une valise"]
    answer: B
  - audio: 你妈妈做什么工作？
    fr: Que fait ta mère comme travail ?
    options: ["Un arbre dans un parc", "Une assiette de légumes", "Une femme médecin dans un hôpital"]
    answer: C
  - audio: 你住在哪儿？
    fr: Où habites-tu ?
    options: ["Un immeuble à côté d'une école", "Un verre de lait", "Une horloge"]
    answer: A
  - audio: 你要喝什么？
    fr: Qu'est-ce que tu veux boire ?
    options: ["Un livre ouvert", "Un verre de lait", "Une voiture blanche"]
    answer: B
  - audio: 你哥哥在哪儿工作？
    fr: Où travaille ton grand frère ?
    options: ["Une assiette de jiaozi", "Une fleur rouge", "Un homme assis à son bureau dans une entreprise"]
    answer: C
  - audio: 你几点起床？
    fr: À quelle heure te lèves-tu ?
    options: ["Un réveil qui sonne à six heures", "Un chat noir", "Un supermarché"]
    answer: A
  - audio: 你怎么去学校？
    fr: Comment vas-tu à l'école ?
    options: ["Un bol de soupe", "Un enfant qui monte dans un bus scolaire", "Un ordinateur portable"]
    answer: B

