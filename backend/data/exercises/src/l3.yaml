# HSK 3 — questions written for this app, in the format of the official papers.
# pic_match, short_mcq, long_mcq and char_pinyin are used by both versions;
# passage_judge and reorder only by HSK 2.0; passage_mcq and make_sentence only by HSK 3.0.
# The build script shuffles the options: the right answer is written first here.
# Append new items at the end (ids are numbered by position).

pic_match:
  - options:
      - Un homme qui cherche quelque chose dans son sac devant une porte
      - Une femme qui prend des photos d'un paysage
      - Deux personnes qui font du sport dans un parc
      - Un garçon qui fait ses devoirs, aidé par sa mère
      - Un homme qui fait la vaisselle
      - Une femme qui range des vêtements dans une valise
    items:
      - audio: |-
          女：你在找什么？
          男：我的护照，我不记得放在哪儿了。
        fr: "— Qu'est-ce que tu cherches ? — Mon passeport, je ne sais plus où je l'ai mis."
        answer: A
      - audio: |-
          女：这儿真漂亮，我要多照几张照片。
          男：好，我在这儿等你。
        fr: "— C'est vraiment beau ici, je vais prendre quelques photos de plus. — D'accord, je t'attends ici."
        answer: B
      - audio: |-
          女：周末你一般做什么？
          男：我经常和朋友一起去公园锻炼身体。
        fr: "— Que fais-tu en général le week-end ? — Je vais souvent faire du sport au parc avec des amis."
        answer: C
      - audio: |-
          男：妈妈，这个题我不会做。
          女：没关系，我们一起看看。
        fr: "— Maman, je n'arrive pas à faire cet exercice. — Ce n'est pas grave, regardons-le ensemble."
        answer: D
      - audio: |-
          女：箱子里的衣服太多了，放不下了。
          男：那就少带几件吧。
        fr: "— Il y a trop de vêtements dans la valise, ça ne rentre plus. — Alors emporte-en moins."
        answer: F
  - options:
      - Un homme qui attend devant un ascenseur
      - Une femme qui paie un chauffeur de taxi
      - Un enfant qui pleure, sa mère le console
      - Un homme qui accueille une nouvelle collègue au bureau
      - Un homme qui arrose des fleurs dans son jardin
      - Un homme en costume qui regarde sa montre sous la pluie
    items:
      - audio: |-
          男：电梯坏了吗？
          女：是的，我们只能走上去了。
        fr: "— L'ascenseur est en panne ? — Oui, il va falloir monter à pied."
        answer: A
      - audio: |-
          女：给你五十。
          男：找您十八块。
        fr: "— Voici cinquante yuans. — Je vous rends dix-huit yuans."
        answer: B
      - audio: |-
          女：别哭了，孩子，妈妈在这儿呢。
          男：我找不到我的小狗了。
        fr: "— Ne pleure plus, mon enfant, maman est là. — Je ne trouve plus mon petit chien."
        answer: C
      - audio: |-
          男：欢迎你来我们公司！
          女：谢谢经理，我会努力工作的。
        fr: "— Bienvenue dans notre entreprise ! — Merci, monsieur le directeur, je vais travailler dur."
        answer: D
      - audio: |-
          女：这些花真漂亮，是你种的吗？
          男：是的，我每天都照顾它们。
        fr: "— Ces fleurs sont magnifiques, c'est toi qui les as plantées ? — Oui, je m'en occupe tous les jours."
        answer: E
  - options:
      - Une étudiante qui rend des livres à la bibliothèque
      - Un homme qui regarde le menu dans un restaurant
      - Une femme qui a de la fièvre, couchée dans son lit
      - Deux amis qui regardent un match à la télévision
      - Un homme qui fait le ménage dans sa chambre
      - Une fille qui fait du vélo
    items:
      - audio: |-
          女：这几本书我看完了，现在还给你们。
          男：好的，请放在这儿。
        fr: "— J'ai fini ces livres, je vous les rends. — Très bien, posez-les ici."
        answer: A
      - audio: |-
          男：请问，有菜单吗？
          女：有，您看一下。
        fr: "— Excusez-moi, vous avez une carte ? — Oui, tenez."
        answer: B
      - audio: |-
          女：我好像发烧了。
          男：那你今天别去上班了，在家休息吧。
        fr: "— J'ai l'impression d'avoir de la fièvre. — Alors ne va pas travailler aujourd'hui, repose-toi à la maison."
        answer: C
      - audio: |-
          男：比赛开始了，快来看！
          女：来了来了，现在几比几？
        fr: "— Le match a commencé, viens vite ! — J'arrive, j'arrive ! C'est combien à combien ?"
        answer: D
      - audio: |-
          女：你的房间真干净！
          男：我昨天打扫了一下午。
        fr: "— Ta chambre est vraiment propre ! — J'ai fait le ménage tout l'après-midi hier."
        answer: E
  - options:
      - Une hôtesse qui parle à un passager dans un avion
      - Une femme qui écrit au tableau devant des élèves
      - Un couple qui choisit un réfrigérateur dans un magasin
      - Un garçon qui joue à un jeu vidéo
      - Une grand-mère qui raconte une histoire à des enfants
      - Une femme qui essaie une jupe devant un miroir
    items:
      - audio: |-
          男：这个冰箱怎么样？
          女：太大了，家里放不下。
        fr: "— Que penses-tu de ce frigo ? — Il est trop grand, il ne rentrera pas chez nous."
        answer: C
      - audio: |-
          女：别玩游戏了，快去写作业！
          男：再玩五分钟就去。
        fr: "— Arrête de jouer, va vite faire tes devoirs ! — Encore cinq minutes et j'y vais."
        answer: D
      - audio: |-
          男：奶奶，再讲一个故事吧！
          女：好，这是最后一个。
        fr: "— Mamie, raconte encore une histoire ! — D'accord, mais c'est la dernière."
        answer: E
      - audio: |-
          女：这条裙子我穿着怎么样？
          男：很漂亮，就买这条吧。
        fr: "— Comment me va cette jupe ? — Très bien, prends celle-là."
        answer: F
      - audio: |-
          女：先生，飞机马上就要起飞了，请关上手机。
          男：好的。
        fr: "— Monsieur, l'avion va décoller, veuillez éteindre votre téléphone. — D'accord."
        answer: A
  - options:
      - Une femme qui demande son chemin, un plan à la main
      - Un homme qui offre un gâteau à une collègue
      - Un médecin qui examine la jambe d'une patiente
      - Un homme qui court sous la pluie sans parapluie
      - Deux personnes qui font la queue à la banque
      - Une femme qui donne à manger à un petit chat
    items:
      - audio: |-
          女：请问，去图书馆怎么走？
          男：你看地图，就在银行的东边。
        fr: "— Excusez-moi, comment va-t-on à la bibliothèque ? — Regardez le plan, c'est juste à l'est de la banque."
        answer: A
      - audio: |-
          男：今天是你的生日，这是我们给你买的蛋糕。
          女：太谢谢你们了！
        fr: "— C'est ton anniversaire aujourd'hui, voici le gâteau qu'on t'a acheté. — Merci beaucoup !"
        answer: B
      - audio: |-
          女：医生，我的腿很疼。
          男：我检查一下。
        fr: "— Docteur, j'ai très mal à la jambe. — Je vais regarder."
        answer: C
      - audio: |-
          男：怎么突然下雨了？我没带伞！
          女：快跑吧，前面有一个超市。
        fr: "— Pourquoi il se met à pleuvoir d'un coup ? Je n'ai pas de parapluie ! — Cours, il y a un supermarché devant."
        answer: D
      - audio: |-
          女：这只小猫饿了，我给它一点儿吃的。
          男：它真可爱。
        fr: "— Ce petit chat a faim, je vais lui donner un peu à manger. — Il est vraiment mignon."
        answer: F
  - options:
      - Un homme qui lave sa voiture
      - Une femme qui fait connaissance avec son nouveau voisin dans l'escalier
      - Un groupe d'amis arrivé au sommet d'une montagne
      - Une étudiante qui sort d'un examen de mathématiques
      - Un homme qui achète un billet de train au guichet
      - Une femme chez le coiffeur
    items:
      - audio: |-
          男：你好，我是新搬来的，住在你楼上。
          女：你好，欢迎欢迎！
        fr: "— Bonjour, je viens d'emménager, j'habite au-dessus de chez vous. — Bonjour, bienvenue !"
        answer: B
      - audio: |-
          男：这次数学考试难吗？
          女：不太难，我觉得我考得还可以。
        fr: "— L'examen de maths était difficile ? — Pas trop, je pense m'en être pas mal sortie."
        answer: D
      - audio: |-
          男：我们终于爬到山上了！
          女：太累了，我们休息一下吧。
        fr: "— On est enfin arrivés en haut de la montagne ! — Je suis épuisée, faisons une pause."
        answer: C
      - audio: |-
          男：请问，还有明天早上的火车票吗？
          女：有，八点的，您要几张？
        fr: "— Excusez-moi, il reste des billets de train pour demain matin ? — Oui, à huit heures, combien en voulez-vous ?"
        answer: E
      - audio: |-
          男：天气这么好，我去洗一下车。
          女：好，洗完了我们出去玩儿。
        fr: "— Il fait si beau, je vais laver la voiture. — D'accord, une fois que c'est fait, on sort se promener."
        answer: A

passage_judge:
  - audio: 为了身体健康，我每天早上都去公园跑步。
    fr: Pour être en bonne santé, je vais courir au parc tous les matins.
    statement: 他每天晚上跑步。
    sfr: Il court tous les soirs.
    answer: false
  - audio: 我们公司离我家很近，我每天走路去上班，只要十分钟。
    fr: Mon entreprise est tout près de chez moi, j'y vais à pied tous les jours, il ne faut que dix minutes.
    statement: 他家离公司不远。
    sfr: Il habite près de son entreprise.
    answer: true
  - audio: 今天的会议很重要，经理让大家都早点儿来。
    fr: La réunion d'aujourd'hui est très importante, le directeur a demandé à tout le monde de venir un peu plus tôt.
    statement: 今天的会议不太重要。
    sfr: La réunion d'aujourd'hui n'est pas très importante.
    answer: false
  - audio: 我妹妹特别喜欢小动物，她家里有两只猫和一只狗。
    fr: Ma petite sœur adore les petits animaux, elle a deux chats et un chien chez elle.
    statement: 他妹妹家里有三只动物。
    sfr: Sa petite sœur a trois animaux chez elle.
    answer: true
  - audio: 这家饭馆的菜很好吃，也不贵，所以每天来这儿吃饭的人很多。
    fr: Les plats de ce restaurant sont très bons et pas chers, c'est pourquoi il y a beaucoup de monde tous les jours.
    statement: 这家饭馆的菜很贵。
    sfr: Les plats de ce restaurant sont très chers.
    answer: false
  - audio: 我上个月去了一次北方，那里比南方冷多了。
    fr: Le mois dernier, je suis allé dans le Nord, il y fait bien plus froid que dans le Sud.
    statement: 北方比南方冷。
    sfr: Il fait plus froid dans le Nord que dans le Sud.
    answer: true
  - audio: 小王感冒了，今天没来上课。
    fr: Xiao Wang a attrapé un rhume, il n'est pas venu en cours aujourd'hui.
    statement: 小王今天去上课了。
    sfr: Xiao Wang est allé en cours aujourd'hui.
    answer: false
  - audio: 先生，您的护照忘在这儿了，请拿好。
    fr: Monsieur, vous avez oublié votre passeport ici, prenez-le bien.
    statement: 那位先生忘了拿护照。
    sfr: Ce monsieur a oublié de prendre son passeport.
    answer: true
  - audio: 我以前不喜欢吃香蕉，但是现在我每天都吃一个。
    fr: Avant, je n'aimais pas les bananes, mais maintenant j'en mange une tous les jours.
    statement: 他现在每天都吃香蕉。
    sfr: Maintenant, il mange une banane tous les jours.
    answer: true
  - audio: 这个城市的地铁很方便，去哪儿都很快。
    fr: Le métro de cette ville est très pratique, on va vite partout.
    statement: 在这个城市坐地铁很不方便。
    sfr: Dans cette ville, prendre le métro n'est pas pratique du tout.
    answer: false
  - audio: 我和丈夫是在大学认识的，我们已经结婚十年了。
    fr: Mon mari et moi nous sommes rencontrés à l'université, nous sommes mariés depuis dix ans.
    statement: 他们结婚十年了。
    sfr: Ils sont mariés depuis dix ans.
    answer: true
  - audio: 这次数学考试我只考了六十分，我要更努力地学习。
    fr: À cet examen de maths, je n'ai eu que soixante points, je dois travailler encore plus dur.
    statement: 他这次考得很好。
    sfr: Il a très bien réussi cette fois.
    answer: false
  - audio: 外面刮风了，你出去的时候多穿件衣服。
    fr: Il y a du vent dehors, mets un vêtement de plus quand tu sors.
    statement: 现在外面在刮风。
    sfr: En ce moment, il y a du vent dehors.
    answer: true
  - audio: 我的电脑坏了，我想明天拿去检查一下。
    fr: Mon ordinateur est en panne, je vais le faire vérifier demain.
    statement: 他的电脑有问题。
    sfr: Son ordinateur a un problème.
    answer: true
  - audio: 王老师上课很认真，同学们都很喜欢他。
    fr: Le professeur Wang fait cours très sérieusement, tous les élèves l'aiment beaucoup.
    statement: 同学们不喜欢王老师。
    sfr: Les élèves n'aiment pas le professeur Wang.
    answer: false
  - audio: 这个周末我打算在家休息，哪儿也不去。
    fr: Ce week-end, je compte me reposer à la maison, je n'irai nulle part.
    statement: 他周末要出去玩儿。
    sfr: Il va sortir s'amuser ce week-end.
    answer: false
  - audio: 我已经习惯了这里的天气，夏天不太热，冬天也不太冷。
    fr: "Je me suis habitué au climat d'ici : l'été n'est pas trop chaud et l'hiver pas trop froid."
    statement: 他还不习惯这里的天气。
    sfr: Il n'est pas encore habitué au climat d'ici.
    answer: false
  - audio: 请大家注意，我们的飞机还有二十分钟就要起飞了。
    fr: Votre attention s'il vous plaît, notre avion décolle dans vingt minutes.
    statement: 飞机马上就要起飞了。
    sfr: L'avion va bientôt décoller.
    answer: true
  - audio: 我的邻居是一位老奶奶，她对我非常热情。
    fr: Ma voisine est une vieille dame, elle est très chaleureuse avec moi.
    statement: 他的邻居很年轻。
    sfr: Son voisin est très jeune.
    answer: false
  - audio: 去年我去中国留学，在那儿学了一年汉语。
    fr: L'année dernière, je suis parti étudier en Chine, j'y ai appris le chinois pendant un an.
    statement: 他在中国学习过汉语。
    sfr: Il a déjà étudié le chinois en Chine.
    answer: true
  - audio: 我很少看电视，我更喜欢看书和听音乐。
    fr: Je regarde rarement la télévision, je préfère lire et écouter de la musique.
    statement: 他非常喜欢看电视。
    sfr: Il adore regarder la télévision.
    answer: false
  - audio: 这件衬衫很好看，可是太大了，有没有小一点儿的？
    fr: Cette chemise est jolie, mais elle est trop grande, vous en avez une un peu plus petite ?
    statement: 他想要小一点儿的衬衫。
    sfr: Il veut une chemise un peu plus petite.
    answer: true
  - audio: 今天是星期天，银行不开门，你明天再去吧。
    fr: Aujourd'hui, c'est dimanche, la banque est fermée, vas-y demain.
    statement: 银行今天不开门。
    sfr: La banque est fermée aujourd'hui.
    answer: true
  - audio: 我们坐了八个小时的船才到那个小城市。
    fr: Nous avons pris le bateau pendant huit heures avant d'arriver dans cette petite ville.
    statement: 他们是坐飞机去的。
    sfr: Ils y sont allés en avion.
    answer: false
  - audio: 我女儿今年上三年级，她最喜欢的是体育课。
    fr: Ma fille est en troisième année cette année, son cours préféré, c'est le sport.
    statement: 他女儿喜欢上体育课。
    sfr: Sa fille aime le cours de sport.
    answer: true

short_mcq:
  - audio: |-
      男：喂，你好，请问张经理在吗？
      女：他正在开会，您一个小时以后再打来吧。
    q: 张经理现在在做什么？
    fr: "— Allô, bonjour, le directeur Zhang est-il là ? — Il est en réunion, rappelez dans une heure."
    qfr: Que fait le directeur Zhang en ce moment ?
    options: [开会, 打电话, 休息]
    ofr: [il est en réunion, il téléphone, il se repose]
    answer: A
  - audio: |-
      女：你的自行车呢？
      男：借给我同事了，他明天还我。
    q: 自行车现在在哪儿？
    fr: "— Où est ton vélo ? — Je l'ai prêté à un collègue, il me le rend demain."
    qfr: Où est le vélo en ce moment ?
    options: [同事那儿, 他家里, 商店]
    ofr: [chez son collègue, chez lui, au magasin]
    answer: A
  - audio: |-
      男：这个周末我们去爬山吧。
      女：我也很想去，可是周末我要照顾奶奶。
    q: 女的周末要做什么？
    fr: "— Allons faire de la montagne ce week-end. — J'aimerais bien, mais ce week-end je dois m'occuper de ma grand-mère."
    qfr: Que doit faire la femme ce week-end ?
    options: [照顾奶奶, 爬山, 上班]
    ofr: [s'occuper de sa grand-mère, faire de la montagne, travailler]
    answer: A
  - audio: |-
      女：你怎么一直在打电话？
      男：我的信用卡找不到了，我在问银行。
    q: 男的什么找不到了？
    fr: "— Pourquoi tu es tout le temps au téléphone ? — Je ne trouve plus ma carte bancaire, j'appelle la banque."
    qfr: Qu'est-ce que l'homme ne trouve plus ?
    options: [信用卡, 手机, 护照]
    ofr: [sa carte bancaire, son téléphone, son passeport]
    answer: A
  - audio: |-
      男：你看起来很累。
      女：是啊，我昨天晚上一点才睡。
    q: 女的为什么很累？
    fr: "— Tu as l'air très fatiguée. — Oui, je ne me suis couchée qu'à une heure du matin."
    qfr: Pourquoi la femme est-elle fatiguée ?
    options: [睡得太晚, 工作太多, 生病了]
    ofr: [elle s'est couchée trop tard, elle a trop de travail, elle est malade]
    answer: A
  - audio: |-
      女：这条裤子有点儿长，有短一点儿的吗？
      男：有，您等一下，我去给您拿。
    q: 女的觉得裤子怎么样？
    fr: "— Ce pantalon est un peu long, vous en avez un plus court ? — Oui, attendez un instant, je vais vous le chercher."
    qfr: Que pense la femme du pantalon ?
    options: [有点儿长, 太短了, 颜色不好]
    ofr: [un peu long, trop court, la couleur ne va pas]
    answer: A
  - audio: |-
      男：你会骑自行车吗？
      女：会，我小时候就学会了。
    q: 女的什么时候学会骑自行车的？
    fr: "— Tu sais faire du vélo ? — Oui, j'ai appris quand j'étais petite."
    qfr: Quand la femme a-t-elle appris à faire du vélo ?
    options: [小时候, 去年, 上大学的时候]
    ofr: [quand elle était petite, l'année dernière, à l'université]
    answer: A
  - audio: |-
      女：你明天几点的飞机？
      男：上午十点的，但是我八点就要到机场。
    q: 男的几点要到机场？
    fr: "— Ton avion est à quelle heure demain ? — À dix heures, mais je dois être à l'aéroport à huit heures."
    qfr: À quelle heure l'homme doit-il être à l'aéroport ?
    options: [八点, 十点, 十二点]
    ofr: [à huit heures, à dix heures, à midi]
    answer: A
  - audio: |-
      男：我们一起打车去吧？
      女：不用了，这儿离地铁站很近，坐地铁更快。
    q: 女的想怎么去？
    fr: "— On prend un taxi ensemble ? — Pas besoin, la station de métro est tout près, c'est plus rapide en métro."
    qfr: Comment la femme veut-elle y aller ?
    options: [坐地铁, 打车, 走路]
    ofr: [en métro, en taxi, à pied]
    answer: A
  - audio: |-
      女：你的汉语水平提高得真快！
      男：谢谢，我经常和中国朋友聊天。
    q: 男的为什么汉语提高得快？
    fr: "— Ton niveau de chinois progresse vraiment vite ! — Merci, je discute souvent avec des amis chinois."
    qfr: Pourquoi son chinois progresse-t-il vite ?
    options: [经常和中国朋友聊天, 每天上课, 看中国电影]
    ofr: [il discute souvent avec des amis chinois, il a cours tous les jours, il regarde des films chinois]
    answer: A
  - audio: |-
      男：这个菜有点儿甜。
