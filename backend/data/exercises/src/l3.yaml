    options: [很认真, 不太热情, 很年轻]
    ofr: [très sérieux, pas très chaleureux, très jeune]
    answer: A
  - audio: |-
      女：今天我们去哪儿吃饭？
      男：去学校旁边那家新开的饭馆吧。
      女：那儿的菜好吃吗？
      男：听同学说很不错。
    q: 男的为什么想去那家饭馆？
    fr: "— Où va-t-on manger aujourd'hui ? — Dans le nouveau restaurant à côté de l'école. — C'est bon là-bas ? — D'après des camarades, c'est très bien."
    qfr: Pourquoi l'homme veut-il aller dans ce restaurant ?
    options: [同学说不错, 离家近, 很便宜]
    ofr: [ses camarades disent que c'est bien, c'est près de chez lui, c'est très bon marché]
    answer: A
  - audio: |-
      男：你每天几点下班？
      女：一般是六点，但是最近工作多，常常八点才下班。
      男：那你要注意身体。
      女：谢谢，我会的。
    q: 女的最近一般几点下班？
    fr: "— À quelle heure finis-tu le travail ? — En général à six heures, mais ces temps-ci j'ai beaucoup de travail, je finis souvent à huit heures. — Alors fais attention à ta santé. — Merci, promis."
    qfr: À quelle heure finit-elle le travail ces temps-ci ?
    options: [八点, 六点, 七点]
    ofr: [à huit heures, à six heures, à sept heures]
    answer: A
  - audio: |-
      女：我想送我妈妈一个生日礼物，你觉得送什么好？
      男：送花吧。
      女：她不太喜欢花。
      男：那就送她一件衣服吧。
    q: 女的想给谁买礼物？
    fr: "— Je voudrais offrir un cadeau d'anniversaire à ma mère, qu'est-ce que je pourrais lui offrir ? — Des fleurs. — Elle n'aime pas trop les fleurs. — Alors un vêtement."
    qfr: À qui la femme veut-elle offrir un cadeau ?
    options: [她妈妈, 她奶奶, 她朋友]
    ofr: [à sa mère, à sa grand-mère, à une amie]
    answer: A
  - audio: |-
      男：你打算什么时候结婚？
      女：明年春天。
      男：在哪儿结婚？
      女：还没决定，可能在南方。
    q: 女的打算什么时候结婚？
    fr: "— Quand comptes-tu te marier ? — Au printemps prochain. — Où ça ? — Ce n'est pas encore décidé, peut-être dans le Sud."
    qfr: Quand la femme compte-t-elle se marier ?
    options: [明年春天, 今年秋天, 还没决定]
    ofr: [au printemps prochain, cet automne, ce n'est pas décidé]
    answer: A
  - audio: |-
      女：你听，外面的声音是什么？
      男：好像是下雨了。
      女：不是，是有人在唱歌。
      男：这么晚了还唱歌！
    q: 外面的声音是什么？
    fr: "— Écoute, c'est quoi ce bruit dehors ? — On dirait qu'il pleut. — Non, c'est quelqu'un qui chante. — Chanter à une heure pareille !"
    qfr: Qu'est-ce que le bruit dehors ?
    options: [有人唱歌, 下雨, 刮风]
    ofr: [quelqu'un chante, il pleut, il y a du vent]
    answer: A

passage_mcq:
  - audio: 我老家在北方，冬天很冷，但是夏天很凉快，所以很多人夏天来这儿玩儿。
    q: 他老家夏天怎么样？
    fr: "Ma ville natale est dans le Nord : l'hiver est très froid, mais l'été est frais, c'est pourquoi beaucoup de gens viennent ici en été."
    qfr: Comment est l'été dans sa ville natale ?
    options: [很凉快, 很热, 常常下雨]
    ofr: [frais, très chaud, il pleut souvent]
    answer: A
  - audio: 同学们，明天我们去动物园，早上八点在学校门口见面，大家别迟到。
    q: 他们明天几点见面？
    fr: Les enfants, demain nous allons au zoo, rendez-vous à huit heures devant l'école, ne soyez pas en retard.
    qfr: À quelle heure se retrouvent-ils demain ?
    options: [八点, 九点, 七点]
    ofr: [à huit heures, à neuf heures, à sept heures]
    answer: A
  - audio: 我每天坐地铁上班，虽然路上要一个小时，但是我可以在地铁上看书，所以我不觉得累。
    q: 他在地铁上做什么？
    fr: Je vais au travail en métro tous les jours ; même si le trajet dure une heure, je peux lire dans le métro, donc je ne trouve pas ça fatigant.
    qfr: Que fait-il dans le métro ?
    options: [看书, 睡觉, 打电话]
    ofr: [il lit, il dort, il téléphone]
    answer: A
  - audio: 我们家有四口人：爸爸、妈妈、哥哥和我。哥哥在银行工作，我还是大学生。
    q: 说话人现在做什么？
    fr: "Nous sommes quatre dans ma famille : papa, maman, mon grand frère et moi. Mon frère travaille dans une banque, moi je suis encore étudiant."
    qfr: Que fait la personne qui parle ?
    options: [上大学, 在银行工作, 做老师]
    ofr: [elle est à l'université, elle travaille dans une banque, elle est professeure]
    answer: A
  - audio: 很多人喜欢在网上买东西，因为又方便又便宜。但是我更喜欢去商店，因为可以先试一下。
    q: 说话人为什么喜欢去商店买东西？
    fr: Beaucoup de gens aiment acheter en ligne, parce que c'est pratique et pas cher. Mais moi, je préfère aller en magasin, parce qu'on peut essayer avant.
    qfr: Pourquoi la personne préfère-t-elle acheter en magasin ?
    options: [可以先试, 更便宜, 更方便]
    ofr: [on peut essayer avant, c'est moins cher, c'est plus pratique]
    answer: A
  - audio: 我的同事小王非常喜欢运动，他每个周末都去打网球，有时候还去游泳。
    q: 小王周末一般做什么？
    fr: "Mon collègue Xiao Wang adore le sport : tous les week-ends il joue au tennis, et parfois il va aussi nager."
    qfr: Que fait Xiao Wang en général le week-end ?
    options: [打网球, 爬山, 踢足球]
    ofr: [il joue au tennis, il fait de la montagne, il joue au football]
    answer: A
  - audio: 欢迎大家来到我们的城市。今天上午我们先去公园，中午在附近吃饭，下午去图书馆。
    q: 他们中午做什么？
    fr: Bienvenue à tous dans notre ville. Ce matin, nous allons d'abord au parc, à midi nous mangeons dans le quartier, et l'après-midi nous allons à la bibliothèque.
    qfr: Que font-ils à midi ?
    options: [吃饭, 去公园, 去图书馆]
    ofr: [ils mangent, ils vont au parc, ils vont à la bibliothèque]
    answer: A
  - audio: 以前我不太会做饭。来中国以后，我每天自己做饭，现在已经做得很好了。
    q: 说话人现在做饭做得怎么样？
    fr: Avant, je ne savais pas vraiment cuisiner. Depuis que je suis en Chine, je cuisine moi-même tous les jours, et maintenant je cuisine très bien.
    qfr: Comment la personne cuisine-t-elle maintenant ?
    options: [很好, 不太好, 不会做]
    ofr: [très bien, pas très bien, elle ne sait pas cuisiner]
    answer: A
  - audio: 这家店的面条很有名，每天中午都有很多人在门口等。我觉得等半个小时也没关系，因为真的很好吃。
    q: 这家店为什么人多？
    fr: Les nouilles de ce restaurant sont très célèbres, il y a beaucoup de monde qui attend devant tous les midis. Attendre une demi-heure ne me dérange pas, c'est vraiment délicieux.
    qfr: Pourquoi y a-t-il beaucoup de monde dans ce restaurant ?
    options: [面条很有名, 很便宜, 离公司近]
    ofr: [ses nouilles sont célèbres, c'est très bon marché, c'est près du bureau]
    answer: A
  - audio: 我女儿今年六岁，她特别喜欢画画儿，每天放学回家都要画一个小时。
    q: 女儿每天放学以后做什么？
    fr: "Ma fille a six ans, elle adore dessiner : tous les jours en rentrant de l'école, elle dessine pendant une heure."
    qfr: Que fait sa fille tous les jours après l'école ?
    options: [画画儿, 唱歌, 看电视]
    ofr: [elle dessine, elle chante, elle regarde la télé]
    answer: A
  - audio: 明天会下大雨，而且会很冷，大家出门的时候别忘了带伞，多穿点儿衣服。
    q: 明天天气怎么样？
    fr: Demain, il va beaucoup pleuvoir et il fera froid ; en sortant, n'oubliez pas votre parapluie et couvrez-vous bien.
    qfr: Quel temps fera-t-il demain ?
    options: [下大雨, 晴天, 很热]
    ofr: [forte pluie, beau temps, très chaud]
    answer: A
  - audio: 我在这家公司工作三年了。同事们对我都很好，工作也很有意思，所以我不想换工作。
    q: 说话人为什么不想换工作？
    fr: Je travaille dans cette entreprise depuis trois ans. Mes collègues sont tous très gentils avec moi et le travail est intéressant, donc je ne veux pas changer de travail.
    qfr: Pourquoi la personne ne veut-elle pas changer de travail ?
    options: [同事都很好, 公司很大, 离家很近]
    ofr: [ses collègues sont très gentils, l'entreprise est grande, c'est près de chez elle]
    answer: A
  - audio: 我上个月搬家了。新家离公司很远，但是房子比以前大，旁边还有一个大公园。
    q: 新家怎么样？
    fr: J'ai déménagé le mois dernier. Le nouveau logement est loin du bureau, mais il est plus grand qu'avant, et il y a un grand parc à côté.
    qfr: Comment est le nouveau logement ?
    options: [比以前大, 离公司很近, 很便宜]
    ofr: [plus grand qu'avant, tout près du bureau, très bon marché]
    answer: A
  - audio: 今天是我和我爱人结婚十年的日子，我们打算晚上去一家很有名的饭馆吃饭。
    q: 他们为什么晚上去饭馆？
    fr: Aujourd'hui, cela fait dix ans que mon conjoint et moi sommes mariés, nous comptons dîner ce soir dans un restaurant très réputé.
    qfr: Pourquoi vont-ils au restaurant ce soir ?
    options: [结婚十年, 过生日, 朋友请客]
    ofr: [ils fêtent leurs dix ans de mariage, c'est un anniversaire, un ami les invite]
    answer: A
  - audio: 学习一种语言，最重要的是多听多说。不要害怕说错，说错了也没关系。
    q: 说话人觉得学语言最重要的是什么？
    fr: Pour apprendre une langue, le plus important est d'écouter et de parler beaucoup. N'ayez pas peur de faire des erreurs, ce n'est pas grave.
    qfr: Selon la personne, qu'est-ce qui est le plus important pour apprendre une langue ?
    options: [多听多说, 多写汉字, 多看书]
    ofr: [écouter et parler beaucoup, écrire beaucoup de caractères, lire beaucoup]
    answer: A
  - audio: 我的手机用了五年了，常常没电，所以我打算这个周末去买一个新的。
    q: 说话人周末打算做什么？
    fr: J'ai mon téléphone depuis cinq ans, il n'a souvent plus de batterie, alors je compte en acheter un nouveau ce week-end.
    qfr: Que compte faire la personne ce week-end ?
    options: [买新手机, 去旅游, 找工作]
    ofr: [acheter un nouveau téléphone, partir en voyage, chercher du travail]
    answer: A
  - audio: 我小时候身体不太好，经常生病。后来我开始每天跑步，现在身体好多了。
    q: 说话人的身体为什么好多了？
    fr: Petit, j'avais une santé fragile, j'étais souvent malade. Ensuite j'ai commencé à courir tous les jours, et maintenant je vais beaucoup mieux.
    qfr: Pourquoi la personne est-elle en bien meilleure santé ?
    options: [每天跑步, 吃药, 多休息]
    ofr: [elle court tous les jours, elle prend des médicaments, elle se repose davantage]
    answer: A
  - audio: 这个图书馆的书很多，环境也很安静，所以周末的时候很多学生来这儿学习。
    q: 学生们为什么来这个图书馆？
    fr: Cette bibliothèque a beaucoup de livres et l'ambiance est très calme, c'est pourquoi beaucoup d'étudiants viennent y travailler le week-end.
    qfr: Pourquoi les étudiants viennent-ils dans cette bibliothèque ?
    options: [书多，也很安静, 离家很近, 可以上网]
    ofr: [beaucoup de livres et du calme, c'est près de chez eux, on peut aller sur Internet]
    answer: A
  - audio: 我爷爷今年八十岁了，可是他身体很健康，每天早上都去公园锻炼，还常常帮奶奶做饭。
    q: 关于爷爷，可以知道什么？
    fr: "Mon grand-père a quatre-vingts ans, mais il est en très bonne santé : il fait de l'exercice au parc tous les matins et aide souvent ma grand-mère à cuisiner."
    qfr: Que sait-on du grand-père ?
    options: [身体很好, 不会做饭, 很少出门]
    ofr: [il est en bonne santé, il ne sait pas cuisiner, il sort rarement]
    answer: A
  - audio: 现在越来越多的年轻人喜欢点外卖，因为工作太忙了，没有时间做饭。
    q: 年轻人为什么喜欢点外卖？
    fr: De plus en plus de jeunes aiment se faire livrer des repas, parce qu'ils ont trop de travail et pas le temps de cuisiner.
    qfr: Pourquoi les jeunes aiment-ils se faire livrer ?
    options: [没有时间做饭, 外卖很好吃, 外卖很便宜]
    ofr: [ils n'ont pas le temps de cuisiner, c'est très bon, c'est très bon marché]
    answer: A
  - audio: 我们学校每年秋天都有运动会，今年我参加了跑步比赛，得了第二名。
    q: 说话人在比赛中怎么样？
    fr: Notre école organise une fête du sport chaque automne ; cette année, j'ai participé à la course et je suis arrivé deuxième.
    qfr: Comment la personne s'est-elle classée ?
    options: [第二名, 第一名, 没参加]
    ofr: [deuxième, premier, elle n'a pas participé]
    answer: A
  - audio: 我住的小区很漂亮，有很多树和花，晚上很多老人在里面跳舞。
    q: 晚上小区里的老人做什么？
    fr: La résidence où j'habite est très belle, il y a beaucoup d'arbres et de fleurs, et le soir beaucoup de personnes âgées y dansent.
    qfr: Que font les personnes âgées le soir dans la résidence ?
    options: [跳舞, 唱歌, 打球]
    ofr: [elles dansent, elles chantent, elles jouent au ballon]
    answer: A
  - audio: 我是去年来中国留学的，刚来的时候一句汉语也不会说，现在我已经可以和中国朋友聊天儿了。
    q: 说话人刚来中国的时候怎么样？
    fr: Je suis venu étudier en Chine l'année dernière ; en arrivant, je ne savais pas dire une phrase de chinois, maintenant je peux déjà discuter avec des amis chinois.
    qfr: Comment était la personne à son arrivée en Chine ?
    options: [不会说汉语, 很会说汉语, 没有朋友]
    ofr: [elle ne parlait pas chinois, elle parlait très bien chinois, elle n'avait pas d'amis]
    answer: A
  - audio: 这个电影我看过两遍了，故事很有意思，我还想再看一遍。
    q: 说话人看过几遍这个电影？
    fr: J'ai déjà vu ce film deux fois, l'histoire est très intéressante, j'ai envie de le revoir encore une fois.
    qfr: Combien de fois la personne a-t-elle vu ce film ?
    options: [两遍, 一遍, 三遍]
    ofr: [deux fois, une fois, trois fois]
    answer: A
  - audio: 坐高铁去那个城市只要两个小时，比坐飞机还方便，所以我一般坐高铁去。
    q: 说话人一般怎么去那个城市？
    fr: En TGV, on rejoint cette ville en deux heures seulement, c'est encore plus pratique que l'avion, donc en général j'y vais en TGV.
    qfr: Comment la personne va-t-elle en général dans cette ville ?
    options: [坐高铁, 坐飞机, 开车]
    ofr: [en train à grande vitesse, en avion, en voiture]
    answer: A

