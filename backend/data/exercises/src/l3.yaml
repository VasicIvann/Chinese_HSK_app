  - words: 准备 了 吗 明天的考试 你 好
    answer: 明天的考试你准备好了吗？
    alt: [你准备好明天的考试了吗？]
    fr: Tu es prêt pour l'examen de demain ?
  - words: 地铁站 附近 吗 有 这儿
    answer: 这儿附近有地铁站吗？
    fr: Y a-t-il une station de métro près d'ici ?
  - words: 让 很 故事 这个 我 难过
    answer: 这个故事让我很难过。
    fr: Cette histoire me rend très triste.

char_pinyin:
  - sentence: 我（jué）得这个问题很简单。
    answer: 觉
    fr: Je trouve que cette question est très simple.
  - sentence: 我们明天一起去爬（shān），好吗？
    answer: 山
    fr: Si on allait faire de la montagne ensemble demain ?
  - sentence: 你（zuì）近工作忙吗？
    answer: 最
    fr: Tu es occupé au travail ces temps-ci ?
  - sentence: 她每天都（kāi）车去上班。
    answer: 开
    fr: Elle va au travail en voiture tous les jours.
  - sentence: 这个问题太（nán）了，我不会。
    answer: 难
    fr: Cette question est trop difficile, je ne sais pas y répondre.
  - sentence: 我的生日是十二（yuè）八号。
    answer: 月
    fr: Mon anniversaire est le 8 décembre.
  - sentence: 请你（guān）上门。
    answer: 关
    fr: Ferme la porte, s'il te plaît.
  - sentence: 你喜欢喝（kā）啡吗？
    answer: 咖
    fr: Tu aimes le café ?
  - sentence: 他（gāng）才给你打电话了。
    answer: 刚
    fr: Il vient de t'appeler.
  - sentence: 我们（xiān）吃饭，然后去看电影。
    answer: 先
    fr: On mange d'abord, puis on va voir un film.
  - sentence: 这件事情我已经忘（jì）了。
    answer: 记
    fr: J'ai déjà oublié cette histoire.
  - sentence: 冬天来了，天气越来越（lěng）。
    answer: 冷
    fr: L'hiver est arrivé, il fait de plus en plus froid.
  - sentence: 他的汉语（shuǐ）平提高得很快。
    answer: 水
    fr: Son niveau de chinois progresse très vite.
  - sentence: 我在（tú）书馆看书。
    answer: 图
    fr: Je lis à la bibliothèque.
  - sentence: 明天你（néng）来参加会议吗？
    answer: 能
    fr: Peux-tu venir à la réunion demain ?
  - sentence: 你的房间真（gān）净！
    answer: 干
    fr: Ta chambre est vraiment propre !
  - sentence: 我（xiǎng）去中国留学。
    answer: 想
    fr: Je voudrais aller étudier en Chine.
  - sentence: 爸爸每天都看（xīn）闻。
    answer: 新
    fr: Papa regarde les informations tous les jours.
